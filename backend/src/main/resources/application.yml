server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blenkir_ssacb}
    username: ${DB_USERNAME:blenkir_app}
    password: ${DB_PASSWORD:blenkir_dev_2026}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: America/Lima

app:
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    secretariat-password: ${DEMO_SECRETARIA_PASSWORD:}
    teacher-password: ${DEMO_DOCENTE_PASSWORD:}
    student-password: ${DEMO_ESTUDIANTE_PASSWORD:}
    guardian-password: ${DEMO_APODERADO_PASSWORD:}
  academic-risk:
    threshold: ${ACADEMIC_RISK_THRESHOLD:11.0}
  jwt:
    # Cambiar en producción. Debe ser Base64 y de al menos 256 bits.
    secret: ${JWT_SECRET:VGhpcyIsIGEgdmVyeSBzZWN1cmUgYW5kIGxvbmcgYmFzZTY0IHNlY3JldCBrZXkgZm9yIGp3ZCBhdXRoZW50aWNhdGlvbiEhIQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
