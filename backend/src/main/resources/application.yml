server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blenkir_ssacb}
    username: ${DB_USERNAME:blenkir_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: America/Lima
  jackson:
    time-zone: America/Lima

app:
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
  jwt:
    # Cambiar en producción. Debe ser Base64 y de al menos 256 bits.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
