services:
  postgres:
    image: postgres:16
    container_name: blenkir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blenkir_ssacb
      POSTGRES_USER: blenkir_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - blenkir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blenkir_app -d blenkir_ssacb"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: blenkir-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Configurar PGADMIN_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Configurar PGADMIN_PASSWORD en .env}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  blenkir_pgdata:
